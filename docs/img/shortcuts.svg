<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Gamestation Gamepad shortcuts: hold Select and Start for 3 seconds for the next output mode; hold Credit and Home for 3 seconds for the configurator; pair from the pad's pairing mode">
  <style>
    .gs-body { fill: #eef0f3; stroke: #8a93a0; stroke-width: 3; }
    .gs-btn { fill: #d4d8de; stroke: #8a93a0; stroke-width: 2; }
    .gs-face { fill: #f6e3d6; stroke: #e8590c; stroke-width: 2; }
    .gs-scr { fill: #1d232b; }
    .gs-ink { fill: #1d232b; }
    .gs-muted { fill: #5d6573; }
    .gs-mode { fill: #2f7de1; stroke: #2f7de1; stroke-width: 3; }
    .gs-cfg { fill: #e4002b; stroke: #e4002b; stroke-width: 3; }
    .gs-sync { fill: #1f9d63; }
    .gs-lbl { font-size: 15px; font-weight: 600; fill: #5d6573; text-anchor: middle; }
  </style>
  <g transform="translate(14 80) scale(0.6)">
    <rect class="gs-btn" x="40" y="10" width="84" height="28" rx="9"/>
    <rect class="gs-btn" x="128" y="20" width="84" height="22" rx="8"/>
    <rect class="gs-btn" x="468" y="20" width="84" height="22" rx="8"/>
    <rect class="gs-btn" x="556" y="10" width="84" height="28" rx="9"/>
    <rect class="gs-cfg" x="403" y="24" width="34" height="16" rx="5"/>
    <rect class="gs-body" x="20" y="40" width="640" height="320" rx="46"/>
    <circle class="gs-btn" cx="130" cy="110" r="40"/>
    <circle class="gs-btn" cx="130" cy="302" r="48"/>
    <path class="gs-btn" d="M118 176 h24 v26 h26 v24 h-26 v26 h-24 v-26 h-26 v-24 h26z"/>
    <rect class="gs-scr" x="244" y="60" width="192" height="262" rx="12"/>
    <rect class="gs-btn" x="228" y="84" width="12" height="38" rx="3"/>
    <rect class="gs-cfg" x="228" y="142" width="12" height="38" rx="3"/>
    <rect class="gs-mode" x="440" y="84" width="12" height="38" rx="3"/>
    <rect class="gs-mode" x="440" y="142" width="12" height="38" rx="3"/>
    <circle class="gs-face" cx="535" cy="80" r="18"/><circle class="gs-face" cx="499" cy="116" r="18"/>
    <circle class="gs-face" cx="571" cy="116" r="18"/><circle class="gs-face" cx="535" cy="152" r="18"/>
    <g class="gs-btn">
      <rect x="479" y="199" width="32" height="26" rx="6"/><rect x="519" y="199" width="32" height="26" rx="6"/><rect x="559" y="199" width="32" height="26" rx="6"/>
      <rect x="479" y="232" width="32" height="26" rx="6"/><rect x="519" y="232" width="32" height="26" rx="6"/><rect x="559" y="232" width="32" height="26" rx="6"/>
      <rect x="479" y="265" width="32" height="26" rx="6"/><rect x="519" y="265" width="32" height="26" rx="6"/><rect x="559" y="265" width="32" height="26" rx="6"/>
      <rect x="479" y="298" width="32" height="26" rx="6"/><rect x="519" y="298" width="32" height="26" rx="6"/><rect x="559" y="298" width="32" height="26" rx="6"/>
    </g>
    <text class="gs-lbl" x="420" y="16" style="fill:#e4002b">HOME</text>
    <text class="gs-lbl" x="262" y="167" style="fill:#e4002b;text-anchor:start">CREDIT</text>
    <text class="gs-lbl" x="262" y="109" style="fill:#c9ced6;text-anchor:start">SETTINGS</text>
    <text class="gs-lbl" x="420" y="109" style="fill:#2f7de1;text-anchor:end">SELECT</text>
    <text class="gs-lbl" x="420" y="167" style="fill:#2f7de1;text-anchor:end">START</text>
  </g>

  <rect class="gs-mode" x="452" y="24" width="14" height="14" rx="3"/>
  <text class="gs-ink" x="476" y="36" font-size="16" font-weight="700">Hold Select and Start for 3 s</text>
  <text class="gs-muted" x="476" y="57" font-size="14">Next output mode (saved)</text>

  <rect class="gs-sync" x="452" y="154" width="14" height="14" rx="3"/>
  <text class="gs-ink" x="476" y="166" font-size="16" font-weight="700">Pairing mode (see the pad's guide)</text>
  <text class="gs-muted" x="476" y="187" font-size="14">Pairs the pad once. After that it</text>
  <text class="gs-muted" x="476" y="205" font-size="14">reconnects when you turn it on.</text>

  <rect class="gs-cfg" x="452" y="270" width="14" height="14" rx="3"/>
  <text class="gs-ink" x="476" y="282" font-size="16" font-weight="700">Hold Credit and Home for 3 s</text>
  <text class="gs-muted" x="476" y="303" font-size="14">Configurator: open http://192.168.7.1</text>
  <text class="gs-muted" x="476" y="321" font-size="14">Do it again (or Save &amp; exit) to leave.</text>

  <text class="gs-muted" x="22" y="388" font-size="13">Credit and Home needs Credit on Capture (the default). Both shortcuts can be switched off in the configurator.</text>
</svg>
